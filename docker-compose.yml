services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ./models:/models
    environment:
      - LD_LIBRARY_PATH=/app
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "8"
      - --model
      - /models/Qwen3.5-4B-Q4_K_M.gguf
      - --n-gpu-layers
      - ${N_GPU_LAYERS:-20}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
