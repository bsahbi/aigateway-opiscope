version: "3.8"

# Hercule machine — LiteLLM + PostgreSQL
# llama-server runs on the Qwen box (192.168.1.10) — separate compose file

services:
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      - ./litellm/.env:/app/.env
    environment:
      - LITELLM_CONFIG_PATH=/app/config.yaml
      - DATABASE_URL=postgresql://litellm:litellm@litellm-db:5432/litellm
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://192.168.1.10:8089/v1}
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  litellm_db_data:
